# MStudio Live — Windows build (CI)
#
# Builds the 64-bit Standalone .exe + VST3 plugins and packs them into the
# Inno Setup installer (release/wininstaller.iss), then uploads the installer
# as a workflow artifact.
#
# Notes:
# - No Steinberg ASIO SDK on CI, so this builds with -DMSTUDIOLIVE_DISABLE_ASIO=ON
#   (Windows audio uses WASAPI). Local builds on a PC keep ASIO (default OFF).
# - The installer is UNSIGNED on CI (no code-signing certificate here):
#   a throwaway copy of wininstaller.iss is built with the SignTool line
#   stripped and SignedUninstaller=no. Signed releases use release/distwin.sh
#   on a PC with CERTFILE set.
# - The [Files] entries in wininstaller.iss expect the staging layout
#   release/MStudioLive/{MStudioLive.exe, Plugins/VST3/*.vst3, README.txt}.

name: Build MStudio Live (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Configure (no ASIO SDK on CI — WASAPI instead)
        run: cmake -G "Visual Studio 17 2022" -A x64 -B build -DMSTUDIOLIVE_DISABLE_ASIO=ON

      - name: Build Release
        run: cmake --build build --config Release

      - name: Stage installer files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/MStudioLive/Plugins/VST3 | Out-Null
          Copy-Item build/MStudioLive_artefacts/Release/Standalone/MStudioLive.exe release/MStudioLive/
          Copy-Item build/MStudioLive_artefacts/Release/VST3/MStudioLive.vst3 -Recurse release/MStudioLive/Plugins/VST3/
          Copy-Item build/MStudioLive_artefacts/Release/VST3/MStudioLiveInstrument.vst3 -Recurse release/MStudioLive/Plugins/VST3/
          Copy-Item doc/README_WINDOWS.txt release/MStudioLive/README.txt

      - name: Build unsigned installer
        shell: pwsh
        run: |
          $iss = Get-Content release/wininstaller.iss
          $iss = $iss -replace '^SignTool=.*$', ''
          $iss = $iss -replace '^SignedUninstaller=yes$', 'SignedUninstaller=no'
          $iss | Set-Content release/wininstaller-ci.iss
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /O"release\instoutput" /DSBVERSION="1.0.0" release/wininstaller-ci.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MStudioLive-1.0.0-Windows-Installer
          path: release/instoutput/*.exe
